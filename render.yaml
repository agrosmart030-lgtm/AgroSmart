services:
  - type: web
    name: agrosmart-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
      - key: PUPPETEER_CACHE_DIR
        value: .cache/puppeteer
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CAPTCHA_ENABLED
        value: "false"
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: EMAIL_USER
        value: apikey
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: '"AgroSmart" <agrosmart030@gmail.com>'
      - key: SMTP_HOST
        value: smtp.sendgrid.net
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_REQUIRE_TLS
        value: "true"
      - key: SMTP_FAMILY
        value: "4"
      - key: EMAIL_TIMEOUT_MS
        value: "30000"
      - key: EMBRAPA_CONSUMER_KEY
        sync: false
      - key: EMBRAPA_CONSUMER_SECRET
        sync: false
      - key: COTACOES_REFRESH_MINUTES
        value: "30"
